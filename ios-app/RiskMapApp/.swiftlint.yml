# SwiftLint Configuration for RiskMapApp
# Optimized for SwiftUI development with reasonable defaults

# Paths to include/exclude
included:
  - RiskMapApp
  - RiskMapAppTests

excluded:
  - Pods
  - Carthage
  - .build
  - DerivedData
  - vendor

# MARK: - General Rules

# Line length (SwiftUI views can be longer)
line_length:
  warning: 150
  error: 200
  ignores_comments: true
  ignores_urls: true

# File length
file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

# Type body length (SwiftUI views can be longer)
type_body_length:
  warning: 400
  error: 600

# Function body length (relaxed for SwiftUI body properties)
function_body_length:
  warning: 80
  error: 150

# Function parameter count
function_parameter_count:
  warning: 6
  error: 8

# Cyclomatic complexity
cyclomatic_complexity:
  warning: 15
  error: 25

# Nesting depth
nesting:
  type_level:
    warning: 2
  statement_level:
    warning: 5

# MARK: - Enabled Rules

opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - first_where
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - nimble_operator
  - number_separator
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

# MARK: - Disabled Rules

disabled_rules:
  - todo
  - trailing_whitespace
  - multiple_closures_with_trailing_closure  # Common in SwiftUI
  - identifier_name  # SwiftUI uses short property names
  - type_name  # Allow flexibility

# MARK: - Custom Rules

custom_rules:
  # No print statements in production code
  no_print:
    name: "No Print Statements"
    regex: '\bprint\('
    match_kinds: identifier
    message: "Use proper logging instead of print()"
    severity: warning
    excluded: ".*Tests\\.swift"

  # SwiftUI @State should be private
  private_state:
    name: "Private @State"
    regex: '@State\s+var'
    message: "@State properties should be private"
    severity: warning
    excluded: ".*Tests\\.swift"

  # Avoid using .init() explicitly
  no_explicit_init:
    name: "No Explicit Init"
    regex: '\.init\('
    message: "Use type inference instead of explicit .init()"
    severity: warning
    excluded: ".*Tests\\.swift"

# MARK: - Rule Configurations

# Identifier naming
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - i
    - j

# Type naming
type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60

# Trailing comma
trailing_comma:
  mandatory_comma: true

# Colon spacing
colon:
  flexible_right_spacing: false
  apply_to_dictionaries: true

# Empty count
empty_count:
  severity: warning

# Force cast/unwrap (warning in tests, error in production)
force_cast:
  severity: error

force_try:
  severity: error

force_unwrapping:
  severity: warning  # Relaxed for tests

# Implicit return in closures (SwiftUI style)
implicit_return:
  included:
    - closure
    - getter

# Multiline arguments
multiline_arguments:
  only_enforce_after_first_closure_on_first_line: true

# Vertical whitespace
vertical_whitespace:
  max_empty_lines: 2

# MARK: - Reporter
reporter: "xcode"
